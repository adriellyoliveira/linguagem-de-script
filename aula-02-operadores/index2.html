<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">

    <script>
        function operacoes() {
            let valor1, valor2, soma, sub, multi, div;

            valor1 = parseInt(document.getElementById("valor1").value);
            valor2 = parseInt(document.getElementById("valor2").value);

            soma = valor1 + valor2;

            sub = valor1 - valor2;

            multi = valor1 * valor2;

            div = valor1 / valor2;

            document.getElementById("result").innerText = soma;
            document.getElementById("sub-result").innerText = sub;
            document.getElementById("multi-result").innerText = multi;
            document.getElementById("div-result").innerText = div;
        }

    </script>
</head>

<body>
    <form>
        <b>Valor 1</b>
        <input type="number" name="valor1" id="valor1">
        <br>
        <b>Valor 2</b>
        <input type="number" name="valor2" id="valor2">
        <br>

        <div class="buttons">
            <input class="btn" type="button" value="Somar" onclick="operacoes()">
            <p>Resultado: <span id="result"></span></p>

            <input class="btn" type="button" value="Subtrair" onclick="operacoes()">
            <p>Resultado: <span id="sub-result"></span></p>

            <input class="btn" type="button" value="Multiplicar" onclick="operacoes()">
            <p>Resultado: <span id="multi-result"></span></p>

            <input class="btn" type="button" value="Dividir" onclick="operacoes()">
            <p>Resultado: <span id="div-result"></span></p>
        </div>

    </form>
</body>

</html>
