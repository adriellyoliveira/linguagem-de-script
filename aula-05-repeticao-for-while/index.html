<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While</title>
</head>
<body>

    <script>
        //FOR
        
        //contagem progressiva de 1 até 10
        for (i=0; i<=10; i++) {
            console.log(i)  
        };

        // contagem regressiva de 10 até 1
        for (i=10; i>=1; i--) {
            console.log(i)
        };

        //------------------------

        //WHILE

        console.log("\n");
        console.log("WHILE");

        var i = 1; //hoistring
        
        //contagem progressiva de 1 até 10
        while(i <= 10) {
            console.log(i);
            i++;
        }

        // contagem regressiva de 10 até 1
        while(i >= 10) {
            i = 10;
            console.log(i);
            i--;
        }
    </script>
    
</body>
</html>
