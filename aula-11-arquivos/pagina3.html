<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            width: 900px;
            height: 900px;
            background-color: yellow;
            position: relative;
        }

        #animate {
            width: 50px;
            height: 50px;
            background-color: red;
            position: absolute;
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: #e58ae5;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #a563a5;
        }
    </style>
</head>
<body>
    <button id="botao" onclick="mover()">Mover</button>
    <div id="container">
        <div id="animate"></div>
    </div>

    <script>
        function mover() {
            let elemento = document.getElementById("animate")
            let pos = 0;
            setInterval(andar, 100);
            let f = setInterval(andar, 5)

            function andar() {
                pos++;
                elemento.style.top = pos + "px"
                if (pos == 850){
                    clearInterval(f)
                }
            }
        }
    </script>
</body>
</html>
